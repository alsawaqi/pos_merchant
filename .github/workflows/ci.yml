# Phase D9 — CI for pos_merchant (Laravel app lives in src/).
#
# Tests run on sqlite :memory: (pinned by src/phpunit.xml) — CI never touches
# the shared live charity_db, so the per-run key:generate is safe (the shared
# APP_KEY with pos_admin only matters on the live stack).
#
# memory_limit MUST stay raised: the ~680-test suite fatally OOMs at PHP's
# default 128M when whoops renders a failure.
#
# NOTE: setup-php enables intl by default; the production containers do NOT
# ship it — avoid intl-dependent code paths (Number::format etc.).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: src

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, iconv, mbstring, openssl, pcntl, pdo_sqlite, sqlite3, simplexml, tokenizer, xml, xmlreader, xmlwriter, zlib
          ini-values: memory_limit=1G
          coverage: none
      - name: Composer cache dir
        id: cc
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cc.outputs.dir }}
          key: ${{ runner.os }}-composer-merchant-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-merchant-
      # A fresh checkout has no storage/ skeleton (untracked): without
      # framework/views any Blade render (PDF export, error pages) 500s
      # with "Please provide a valid cache path".
      - run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan config:clear && vendor/bin/pest

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: p0_test
          POSTGRES_PASSWORD: p0_disposable_only
          POSTGRES_DB: qr_fix4_p0
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U p0_test -d qr_fix4_p0"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      LAUNCH_P0_DISPOSABLE: '1'
      DB_CONNECTION: pgsql
      DB_HOST: qrfix2-pg
      DB_PORT: '5432'
      DB_DATABASE: qr_fix4_p0
      DB_USERNAME: p0_test
      DB_PASSWORD: p0_disposable_only
      DB_URL: ''
      CHARITY_API_URL: ''
      BROADCAST_CONNECTION: 'null'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      APP_KEY: 'base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE='
    steps:
      - uses: actions/checkout@v4
        with:
          path: pos_merchant
      # Owner must push companion branches after independent review.
      # Private cross-repo checkouts require POS_CI_READ_TOKEN with contents:read.
      - uses: actions/checkout@v4
        with:
          repository: alsawaqi/pos_admin
          ref: launch-p0-tenancy
          path: pos_admin
          token: ${{ secrets.POS_CI_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: alsawaqi/pos_api
          ref: launch-p0-tenancy
          path: pos_api
          token: ${{ secrets.POS_CI_READ_TOKEN || github.token }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, iconv, mbstring, openssl, pcntl, pdo_pgsql, pdo_sqlite, sqlite3, simplexml, tokenizer, xml, xmlreader, xmlwriter, zlib
          ini-values: memory_limit=1G
          coverage: none
      - name: Prepare disposable real-schema job
        run: |
          echo '127.0.0.1 qrfix2-pg' | sudo tee -a /etc/hosts
          for app in pos_api pos_admin pos_merchant; do
            (
              cd "$app/src"
              mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
              cp .env.example .env
              composer install --prefer-dist --no-interaction --no-progress
            )
          done
      - name: Tenant isolation and all PostgreSQL races
        run: |
          set -o pipefail
          php pos_admin/tests/Postgres/run-launch-p0.php | tee postgres-job.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos_merchant-postgres-evidence
          path: postgres-job.log

  # ---- CD: auto-deploy to the production VPS ----
  # Push to main only (never PRs), and only after every test job is green.
  # SSHes into the VPS, pulls, and runs deploy/deploy.sh — the same
  # documented sequence as a manual release, ending in a health check.
  # Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (the dedicated gha-pos-deploy
  # key), VPS_KNOWN_HOSTS (pinned host key).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [php-tests, frontend-typecheck, postgres-tests]
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy-pos-merchant
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Pull + deploy on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd ~/pos_merchant && git pull --ff-only && bash deploy/deploy.sh'
